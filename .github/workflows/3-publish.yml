name: 3. 승인된 게시물 자동 발행

on:
  schedule:
    - cron: "*/15 * * * *" # 15분마다 발행 시각이 지난 게시물 확인
  workflow_dispatch:
    inputs:
      only:
        description: "특정 게시물 즉시 발행 (예: content/2026-10-17-xxx). 비우면 예정된 것만"
        required: false
        default: ""
      dry_run:
        description: "실제로 올리지 않고 확인만"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish # 중복 발행 방지
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 방금 승인된 게시물까지 포함한 최신 상태로

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml pydantic

      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python -m src.publish "${ARGS[@]}"

      - name: 발행 기록 저장
        if: always()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/*/published.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "published: $(date -u +%FT%TZ)"
          git pull --rebase origin main && git push origin HEAD:main
