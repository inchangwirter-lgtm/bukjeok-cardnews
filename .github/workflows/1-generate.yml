name: 1. 카드뉴스 생성 → 검수 PR

on:
  schedule:
    - cron: "0 11 * * *"  # 매일 20:00 KST — 마케팅 꿀팁 (UTC 기준 표기)
    - cron: "30 11 * * *" # 매일 20:30 KST — 자영업자 마케팅 사례
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 직접 지정 (비우면 Claude가 자동 기획)"
        required: false
        default: ""
      series:
        description: "tips = 고민 해결 / cases = 자영업자 마케팅 사례"
        type: choice
        options: [tips, cases]
        default: tips
      avoid:
        description: "(다시 만들기) 피할 주제"
        required: false
        default: ""
      skip_category:
        description: "(다시 만들기) 피할 카테고리"
        required: false
        default: ""
      publish_at:
        description: "발행 시각 직접 지정 (예: 2026-10-21T13:00:00+09:00). 비우면 자동"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Claude로 원고 작성
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic }}
          SERIES: ${{ github.event.schedule == '30 11 * * *' && 'cases' || inputs.series || 'tips' }}
          AVOID: ${{ inputs.avoid }}
          SKIP_CATEGORY: ${{ inputs.skip_category }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: python -m src.generate --topic "$TOPIC" --series "$SERIES" --avoid "$AVOID" --skip-category "$SKIP_CATEGORY" --publish-at "$PUBLISH_AT"

      - name: AI 사진 생성
        if: steps.gen.outputs.post_dir != ''
        env:
          HF_KEY: ${{ secrets.HF_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_API_SECRET: ${{ secrets.HF_API_SECRET }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.images "${{ steps.gen.outputs.post_dir }}"

      - name: 카드 이미지 렌더링
        if: steps.gen.outputs.post_dir != ''
        run: python -m src.render "${{ steps.gen.outputs.post_dir }}"

      - name: 검수용 PR 생성
        if: steps.gen.outputs.post_dir != ''
        env:
          GH_TOKEN: ${{ github.token }}
          POST_DIR: ${{ steps.gen.outputs.post_dir }}
          TOPIC: ${{ steps.gen.outputs.topic }}
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
        run: |
          BRANCH="draft/$(basename "$POST_DIR")"
          git config user.name "cardnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content topics.yaml
          git commit -m "draft: $TOPIC"
          git push origin "$BRANCH"
          CARDS_SHA=$(git rev-parse HEAD) python -m src.pr_body "$POST_DIR" "$BRANCH" > "$RUNNER_TEMP/body.md"
          gh label create cardnews --color 2B50FF --force >/dev/null
          PR_URL=$(gh pr create --base main --head "$BRANCH" --label cardnews \
            --title "[검수] $TOPIC" --body-file "$RUNNER_TEMP/body.md")
          echo "$PR_URL"
          CARDS_SHA=$(git rev-parse HEAD) python -m src.notify review "$POST_DIR" "${PR_URL##*/}"
