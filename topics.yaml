# 게시물 1개 = 카테고리 1개 + 사장님 고민 1개 + 따라 하면 해결되는 방법.
# 카테고리는 최근에 덜 다룬 순서로 돌아가며 자동 선택됩니다.
# examples 는 Claude가 참고하는 '고민 예시'일 뿐, 그대로 쓰진 않고 비슷한 결의 새 고민을 고릅니다.
categories:
  - name: "네이버 플레이스"
    examples:
      - 플레이스 등록했는데 동네 이름으로 검색하면 안 나와요
      - 대표키워드 5개를 뭘로 넣어야 할지 모르겠어요
      - 리뷰는 쌓이는데 저장·전화가 안 늘어요
      - 사진·메뉴판을 어떻게 올려야 클릭이 늘까요
      - 영수증 리뷰 부탁을 어떻게 해야 자연스러울까요
  - name: "인스타그램"
    examples:
      - 매장 계정 팔로워가 몇 달째 그대로예요
      - 릴스를 올려도 조회수가 200에서 안 늘어요
      - 프로필만 보고 나가요, 방문이나 DM으로 안 이어져요
      - 해시태그를 뭘 써야 할지 모르겠어요
      - 인스타 광고(홍보하기) 버튼 눌러도 되나요
  - name: "스레드"
    examples:
      - 스레드를 시작했는데 뭘 써야 할지 모르겠어요
      - 글을 올려도 반응이 0이에요
      - 스레드에서 가게 홍보 티 안 나게 하는 법
      - 스레드 글을 인스타·매출로 연결하는 법
  - name: "AI 활용"
    examples:
      - 리뷰 답글 쓰는 데 매일 30분씩 걸려요
      - 신메뉴 소개 문구를 매번 쥐어짜요
      - 이벤트 포스터·메뉴판 이미지를 맡길 돈이 없어요
      - 인스타 캡션·해시태그를 매번 고민해요
      - 손님 문의 답장을 빠르게 하고 싶어요

